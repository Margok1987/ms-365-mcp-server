name: Verify Microsoft 365 File Transfers

on:
  push:
    paths:
      - "src/lib/drive-pdf-mail-attachment.ts"
      - "src/lib/drive-pdf-mail-attachment.test.ts"
      - "src/lib/mail-attachment-to-drive.ts"
      - "src/lib/mail-attachment-to-drive.test.ts"
      - "src/graph-tools.ts"
      - "src/graph-client.ts"
      - ".github/workflows/verify-drive-pdf-draft.yml"
  pull_request:
    paths:
      - "src/lib/drive-pdf-mail-attachment.ts"
      - "src/lib/drive-pdf-mail-attachment.test.ts"
      - "src/lib/mail-attachment-to-drive.ts"
      - "src/lib/mail-attachment-to-drive.test.ts"
      - "src/graph-tools.ts"
      - "src/graph-client.ts"
      - ".github/workflows/verify-drive-pdf-draft.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout provider source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Graph API client
        run: npm run generate
      - name: Static TypeScript typecheck
        run: npm run typecheck
      - name: Provider regression lint
        run: npm run lint
      - name: Bidirectional attachment transfer unit tests
        run: npx vitest run --maxWorkers=1 --no-file-parallelism src/lib/drive-pdf-mail-attachment.test.ts src/lib/mail-attachment-to-drive.test.ts
      - name: Bundle MCP server
        run: npm run build
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=critical
      - name: Provider format policy
        run: npm run format:check
      - name: Formatter output evidence (temporary runner only)
        if: failure()
        run: |
          npx prettier --write README.md src/graph-tools.ts src/lib/drive-pdf-mail-attachment.ts src/lib/drive-pdf-mail-attachment.test.ts src/lib/mail-attachment-to-drive.ts src/lib/mail-attachment-to-drive.test.ts
          node -e 'const fs=require("fs");const paths=["README.md","src/graph-tools.ts","src/lib/drive-pdf-mail-attachment.ts","src/lib/drive-pdf-mail-attachment.test.ts","src/lib/mail-attachment-to-drive.ts","src/lib/mail-attachment-to-drive.test.ts"];for(const path of paths){const source=fs.readFileSync(path);const encoded=source.toString("base64");const width=3600;const parts=Math.ceil(encoded.length/width);for(let i=0;i<parts;i++){console.log("FORMATTED_SOURCE_CHUNK "+JSON.stringify({path,index:i,parts,data:encoded.slice(i*width,(i+1)*width)}));}}'
