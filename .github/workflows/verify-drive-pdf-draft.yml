name: Verify Microsoft 365 File Transfers

on:
  push:
    paths:
      - "src/lib/drive-pdf-mail-attachment.ts"
      - "src/lib/drive-pdf-mail-attachment.test.ts"
      - "src/lib/mail-attachment-to-drive.ts"
      - "src/lib/mail-attachment-to-drive.test.ts"
      - "src/graph-tools.ts"
      - "src/graph-client.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-drive-pdf-draft.yml"
  pull_request:
    paths:
      - "src/lib/drive-pdf-mail-attachment.ts"
      - "src/lib/drive-pdf-mail-attachment.test.ts"
      - "src/lib/mail-attachment-to-drive.ts"
      - "src/lib/mail-attachment-to-drive.test.ts"
      - "src/graph-tools.ts"
      - "src/graph-client.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-drive-pdf-draft.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout provider source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Graph API client
        run: npm run generate
      - name: Static TypeScript typecheck
        run: npm run typecheck
      - name: Provider regression lint
        run: npm run lint
      - name: Bidirectional attachment transfer unit tests
        run: npx vitest run --maxWorkers=1 --no-file-parallelism --testTimeout=30000 src/lib/drive-pdf-mail-attachment.test.ts src/lib/mail-attachment-to-drive.test.ts
      - name: Bundle MCP server
        run: npm run build
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=critical
      - name: Format policy - transferred-file source scope
        run: npx prettier --check README.md src/graph-client.ts src/graph-tools.ts src/lib/drive-pdf-mail-attachment.ts src/lib/drive-pdf-mail-attachment.test.ts src/lib/mail-attachment-to-drive.ts src/lib/mail-attachment-to-drive.test.ts
