name: Calendar Full App Candidate CI

on:
  push:
    branches:
      - calendar-full-app-20261007

jobs:
  verify-calendar-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate current Graph client
        run: npm run generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm run test
      - name: Record repository format baseline
        continue-on-error: true
        run: npm run format:check
