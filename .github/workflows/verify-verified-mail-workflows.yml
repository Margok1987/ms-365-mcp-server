name: Verify verified-mail workflows branch

on:
  push:
    branches:
      - engineering/verified-mail-workflows-0.165-20261028

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install patch-package (if needed)
        run: npm i -D patch-package

      - name: Install dependencies
        run: npm ci

      - name: Generate
        run: npm run generate

      - name: Lint code
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        if: matrix.node-version != '18.x'
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        if: matrix.node-version != '18.x'
        run: npm test

      - name: Smoke test (Node 18 runtime check)
        if: matrix.node-version == '18.x'
        run: node dist/index.js --list-presets
